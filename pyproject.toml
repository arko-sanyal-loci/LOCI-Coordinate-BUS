[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loci-coordination-bus"
version = "0.1.0"
description = "Secure, local-first inter-agent coordination bus for LOCI-style multi-agent projects"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["coordination_bus*"]
